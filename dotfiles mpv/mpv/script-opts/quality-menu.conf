# Key bindings inside menu
up_binding=UP WHEEL_UP
down_binding=DOWN WHEEL_DOWN
select_binding=ENTER MBTN_LEFT
close_menu_binding=ESC MBTN_RIGHT

# Styling
scale_playlist_by_window=yes
style_ass_tags={\fnInter\fs20\b0\bord0\shad0\1c&HFFFFFF&}
curtain_opacity=0
menu_timeout=6

# Columns: clean YouTube-style format (Resolution + FPS only)
columns_video=-resolution,frame_rate

# Fetch formats
fetch_formats=yes

