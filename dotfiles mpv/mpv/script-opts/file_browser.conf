# Save and remember the last opened directory across sessions
save_last_opened_directory=yes
default_to_last_opened_directory=yes

# Move the file browser cursor to the currently playing video/song
cursor_follows_playing_item=yes

# Enable wrap-around scrolling (scrolling past top jumps to bottom)
wrap=yes

# Number of files shown per page in the OSD
num_entries=18

# Dot files & directory filtering (Linux clean view)
filter_dot_dirs=auto
filter_dot_files=auto
