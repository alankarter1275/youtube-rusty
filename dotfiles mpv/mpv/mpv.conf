# --- Rendering & Hardware Acceleration ---
vo=gpu-next
gpu-api=opengl
gpu-context=wayland
hwdec=auto-safe

# Quality & Scaling (Balanced for Intel UHD 605)
scale=spline36
cscale=bicubic
dscale=hermite
dither-depth=auto
keepaspect-window=yes

# --- UI & Interface ---
osc=no                      # Handled by ModernZ script
border=no
osd-bar=no
osd-font='Inter'
osd-font-size=30
osd-color='#FFFFFF'
osd-border-color='#000000'
osd-border-size=2
osd-align-x=left
osd-align-y=top
osd-margin-x=20
osd-margin-y=20

# --- Subtitles ---
sub-font='Inter'
sub-font-size=40
sub-color='#FFFFFF'
sub-border-color='#000000'
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color='#33000000'
sub-auto=fuzzy
sub-fix-timing=yes
slang=eng,en

# --- Audio ---
volume-max=150
audio-pitch-correction=yes
alang=eng,en

# --- Behavior & Cache ---
save-position-on-quit=yes
watch-later-options-remove=sub-pos

cache=auto
demuxer-max-bytes=150M
demuxer-max-back-bytes=50M

# Streaming (Default to 360p, allow up to 1080p hardware-accelerated VP9/H.264, block CPU-heavy AV1)
ytdl-format=bestvideo[height<=?360][vcodec!^=av01]+bestaudio/best[height<=?360]
