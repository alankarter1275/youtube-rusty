[package]
name = "youtube-rusty"
version = "0.1.0"
edition = "2021"

[dependencies]
libadwaita = { version = "0.7", features = ["v1_5"] }
gtk4 = { version = "0.9", features = ["v4_14"] }
glib = "0.20"
tokio = { version = "1.38", features = ["full"] }
rustypipe = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
once_cell = "1.19"
